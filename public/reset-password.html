<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Qura, Set a New Password</title>
<style>
  :root{--navy:#0A1A30;--teal:#0E8C7E;--cyan:#00C2B8;--text:#1A2233;--muted:#5A6783;--line:#E4EAF3;--bg:#F4F7FB;--red:#E11D48}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(10,26,48,.08)}
  h1{font-size:22px;margin:0 0 6px}
  p.sub{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 22px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin-bottom:14px;font-family:inherit}
  input:focus{outline:2px solid var(--cyan);outline-offset:1px;border-color:var(--cyan)}
  button{width:100%;padding:13px;border:none;border-radius:10px;background:var(--teal);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  button:disabled{opacity:.55;cursor:default}
  .msg{font-size:13.5px;line-height:1.6;padding:12px 14px;border-radius:10px;margin-bottom:16px}
  .err{background:#FDECEF;border:1px solid #F3C3CD;color:#8A1030}
  .ok{background:#E6F4F2;border:1px solid #B8E2DC;color:#06776F}
  .hint{font-size:12.5px;color:var(--muted);margin:-6px 0 16px}
  a{color:var(--teal)}
  .foot{margin-top:20px;font-size:12.5px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>Set a new password</h1>
  <p class="sub">Choose a new password for your Qura account. Once saved, sign in with it on the app or the website.</p>

  <div id="message"></div>

  <div id="form" style="display:none">
    <label for="pw">New password</label>
    <input id="pw" type="password" autocomplete="new-password" />
    <label for="pw2">Confirm new password</label>
    <input id="pw2" type="password" autocomplete="new-password" />
    <p class="hint">At least 8 characters. Use something you do not use elsewhere.</p>
    <button id="save">Save new password</button>
  </div>

  <div class="foot">Qura Ltd, trading as Qura Health</div>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL = "https://jggvouhtmzciptqltjum.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpnZ3ZvdWh0bXpjaXB0cWx0anVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5MjUxNDgsImV4cCI6MjA5ODUwMTE0OH0.tob2XD5bJtwzu9v79iw0S2-Z5LDVcIYV8i1m9uobq3o";

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { detectSessionInUrl: true, flowType: "implicit", persistSession: false },
  });

  const msgEl = document.getElementById("message");
  const formEl = document.getElementById("form");
  const btn = document.getElementById("save");

  const show = (text, kind) => { msgEl.innerHTML = '<div class="msg ' + kind + '">' + text + "</div>"; };

  // The reset link carries its token in the URL. Supabase turns it into a short
  // lived session; without one, there is nothing to update and the link has
  // either expired or already been used.
  const ready = await (async () => {
    try {
      const { data } = await supabase.auth.getSession();
      if (data && data.session) return true;
      await new Promise((r) => setTimeout(r, 600));
      const again = await supabase.auth.getSession();
      return !!(again.data && again.data.session);
    } catch (e) { return false; }
  })();

  if (!ready) {
    show('This reset link is no longer valid. Reset links expire after 1 hour and can only be used once. Please request a new one from the app or from the sign-in page.', "err");
  } else {
    formEl.style.display = "block";
  }

  btn.addEventListener("click", async () => {
    const pw = document.getElementById("pw").value;
    const pw2 = document.getElementById("pw2").value;
    if (pw.length < 8) { show("Your password needs to be at least 8 characters.", "err"); return; }
    if (pw !== pw2) { show("The two passwords do not match.", "err"); return; }
    btn.disabled = true;
    btn.textContent = "Saving...";
    try {
      const { error } = await supabase.auth.updateUser({ password: pw });
      if (error) {
        show("We could not save that password. " + error.message, "err");
        btn.disabled = false;
        btn.textContent = "Save new password";
        return;
      }
      formEl.style.display = "none";
      show("Your password has been changed. You can now sign in with it on the Qura app or on the website.", "ok");
      await supabase.auth.signOut();
    } catch (e) {
      show("Something went wrong. Please request a new reset link and try again.", "err");
      btn.disabled = false;
      btn.textContent = "Save new password";
    }
  });
</script>
</body>
</html>

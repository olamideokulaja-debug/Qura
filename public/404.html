<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found — Qura</title>
<meta name="description" content="That page does not exist on Qura. Find clinicians, workforce suppliers and live healthcare opportunities from the home page." />
<meta name="robots" content="noindex" />
<style>
  :root{--navy:#0A1A30;--teal:#0E8C7E;--line:#E7ECF4;--muted:#586683}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;
       background:#EBF0F7;color:var(--navy);display:grid;place-items:center;min-height:100vh;padding:24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;
        padding:38px 34px;box-shadow:0 18px 50px rgba(10,26,48,.10)}
  h1{font-size:26px;margin:0 0 8px}
  p{color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 22px}
  a.btn{display:inline-block;padding:11px 20px;border-radius:10px;background:var(--teal);color:#fff;
        text-decoration:none;font-weight:700;font-size:14.5px;margin-right:10px}
  a.alt{display:inline-block;padding:11px 20px;border-radius:10px;border:1px solid var(--line);
        color:var(--navy);text-decoration:none;font-size:14.5px}
  .links{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);font-size:13.5px}
  .links a{color:var(--teal);text-decoration:none;margin-right:16px;white-space:nowrap;line-height:2}
</style>
</head>
<body>
  <div class="card">
    <div style="font-size:12px;font-weight:700;letter-spacing:.09em;color:var(--teal)">ERROR 404</div>
    <h1>That page does not exist</h1>
    <p>
      The address may have changed, or the link that brought you here may be out of date.
      Nothing has gone wrong with your account.
    </p>
    <a class="btn" href="/">Go to the home page</a>
    <a class="alt" href="/faq">Read the FAQs</a>
    <div class="links">
      <a href="/for-clinicians">For clinicians</a>
      <a href="/for-suppliers">For workforce suppliers</a>
      <a href="/marketplace">Marketplace</a>
      <a href="/how-it-works">How it works</a>
      <a href="/pricing">Pricing</a>
      <a href="/faq">FAQs</a>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qura &middot; Email confirmed</title>
<style>
  body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#F7F9FC;color:#12263F;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{background:#fff;border:1px solid #E6ECF5;border-radius:18px;padding:38px 34px;max-width:460px;text-align:center;box-shadow:0 10px 40px rgba(18,38,63,.06)}
  .tick{width:56px;height:56px;border-radius:50%;background:#E6F6F3;color:#0E8C7E;display:grid;place-items:center;margin:0 auto 18px;font-size:28px;font-weight:800}
  h1{font-size:22px;margin:0 0 8px}
  p{color:#5A6783;font-size:14.5px;line-height:1.65;margin:0 0 22px}
  .btn{display:inline-block;background:#0E8C7E;color:#fff;text-decoration:none;font-weight:700;font-size:15px;border-radius:999px;padding:13px 30px}
  .foot{color:#8494AD;font-size:12.5px;margin-top:20px;line-height:1.6}
  a.plain{color:#0E8C7E}
</style>
</head><body>
<div class="card">
  <div class="tick">&check;</div>
  <h1>Your email is confirmed</h1>
  <p>Thank you. Your Qura account is ready. Sign in and we will pick up exactly where you left off.</p>
  <a class="btn" href="/">Sign in to Qura</a>
  <div class="foot">
    Using the app? Open Qura on your phone and sign in there instead.<br>
    Any trouble, email <a class="plain" href="mailto:support@qurahealth.org">support@qurahealth.org</a>
  </div>
</div>
<script>
  // The confirmation link arrives with tokens in the address bar. Clear them so
  // the address cannot be shared or bookmarked with a live token in it, and so
  // the app is entered through one door only: the sign-in page.
  if (window.location.hash && window.location.hash.indexOf("access_token") !== -1) {
    history.replaceState(null, "", window.location.pathname);
  }
</script>
</body></html>
